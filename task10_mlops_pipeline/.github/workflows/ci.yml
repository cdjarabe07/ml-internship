name: API Tests

on:
  push:
    paths:
      - 'task10_mlops_pipeline/**'
  pull_request:
    paths:
      - 'task10_mlops_pipeline/**'

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: task10_mlops_pipeline/app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        run: pytest test_api.py -v

      - name: Build Docker image (vérifie que le Dockerfile est valide)
        run: docker build -t predictive-maintenance-api .
